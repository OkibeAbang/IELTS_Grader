<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f6b35" />
    <meta
      name="description"
      content="AI-powered IELTS practice: Writing, Reading, Listening, and Speaking with instant, rubric-accurate feedback."
    />

    <!-- Open Graph / Twitter card: static tags for the homepage, since this
         is a client-rendered SPA with no server-side rendering — crawlers
         (WhatsApp, Instagram, etc.) only ever see this initial HTML, not
         anything set later via JS. Per-route dynamic previews would need
         prerendering or SSR; tracked in REMINDERS.md as a known limit. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="9Band" />
    <meta property="og:title" content="9Band — AI-powered IELTS practice" />
    <meta
      property="og:description"
      content="Instant, rubric-accurate feedback on IELTS Writing, Reading, Listening and Speaking — graded against the same criteria examiners use."
    />
    <meta property="og:url" content="https://ielts-grader-kappa.vercel.app/" />
    <meta property="og:image" content="https://ielts-grader-kappa.vercel.app/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="9Band — AI-powered IELTS practice" />
    <meta
      name="twitter:description"
      content="Instant, rubric-accurate feedback on IELTS Writing, Reading, Listening and Speaking — graded against the same criteria examiners use."
    />
    <meta name="twitter:image" content="https://ielts-grader-kappa.vercel.app/logo512.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>9Band</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
